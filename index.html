<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>MotionDiff — see what moves</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%2317140f'/%3E%3Crect x='10' y='20' width='24' height='24' fill='%23808080'/%3E%3Crect x='30' y='20' width='24' height='24' fill='%23c2301a'/%3E%3C/svg%3E">
<script>
  // Set the theme before first paint: the saved choice, else the system's.
  (() => {
    let theme = null;
    try { theme = localStorage.getItem('motiondiff-theme'); } catch { /* no storage */ }
    if (theme !== 'light' && theme !== 'dark') {
      theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.dataset.theme = theme;
  })();
</script>
<link rel="stylesheet" href="/src/styles/main.css">
</head>
<body>
<!-- Everything inside #app is built by src/ui/shell.js. -->
<div id="app"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
