name: Build & Deploy

# Builds the site and publishes it to GitHub Pages straight from the build
# output, with no gh-pages branch. A merged pull request is a push to master.
#
# Needs, once, in the repository settings: Pages → Build and deployment →
# Source: "GitHub Actions".

on:
  push:
    branches:
      - master
  workflow_dispatch:     # manual run from the Actions tab

permissions:
  contents: read
  pages: write           # publish to Pages
  id-token: write        # prove to Pages that this run is the one deploying

# One deployment at a time; a newer push waits for the one in progress
# rather than cancelling it half-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
